<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020"><title>Random</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:#0b1020;color:#edf2ff;font-family:Inter,system-ui,sans-serif}
#start{min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px 24px 120px}
#start h1{font-size:clamp(3rem,9vw,6rem);letter-spacing:-.075em;margin:0 0 12px}#start p{max-width:540px;color:#9eacc7;line-height:1.7}
#random-ai-bar{position:fixed!important;z-index:2147483647!important;left:50%!important;bottom:20px!important;transform:translateX(-50%)!important;width:min(760px,calc(100vw - 28px))!important;display:flex!important;gap:9px!important;align-items:center!important;padding:10px!important;border:1px solid rgba(180,200,255,.2)!important;border-radius:18px!important;background:rgba(10,16,32,.9)!important;box-shadow:0 12px 50px #0006!important;backdrop-filter:blur(22px)!important;color:#eef3ff!important;font:500 14px Inter,system-ui,sans-serif!important}
#random-ai-bar input{flex:1!important;min-width:0!important;border:0!important;outline:0!important;background:transparent!important;color:inherit!important;font:inherit!important;padding:12px 10px!important}
#random-ai-bar input::placeholder{color:#9aa8c2!important}#random-ai-bar button{border:0!important;border-radius:12px!important;padding:11px 17px!important;background:#a8c7ff!important;color:#101a31!important;font:700 13px Inter,system-ui,sans-serif!important;cursor:pointer!important}#random-ai-bar button:disabled{opacity:.55!important;cursor:wait!important}
#random-ai-status{position:fixed!important;z-index:2147483646!important;left:50%!important;bottom:89px!important;transform:translateX(-50%)!important;max-width:calc(100vw - 28px)!important;padding:8px 13px!important;border:1px solid #b4c8ff26!important;border-radius:10px!important;background:#0a1020e8!important;color:#d5e0f5!important;font:12px Inter,system-ui,sans-serif!important;text-align:center!important}
#random-ai-status:empty{display:none!important}#random-ai-status.error{color:#ffaaaa!important}
@media(max-width:520px){#random-ai-bar{bottom:12px!important;gap:5px!important}#random-ai-bar button{padding:11px 13px!important}}
</style></head><body>
<main id="start"><div><h1>Random.</h1><p>Create a completely new web experience, then use the bar at the bottom to change anything on the page. Your page is saved in this browser.</p></div></main>
<div id="random-ai-status" role="status" aria-live="polite"></div>
<form id="random-ai-bar"><input id="random-ai-input" autocomplete="off" placeholder="Describe what you want to create…" aria-label="Describe a page or change"><button id="random-ai-submit" type="submit">Generate</button></form>
<script>
(function(){
'use strict';
var MODEL='gemini-3.5-flash-lite',KEY_SLOT='geminiApiKey',PAGE_SLOT='randomGeneratedHtml';
var form=document.getElementById('random-ai-bar'),input=document.getElementById('random-ai-input'),button=document.getElementById('random-ai-submit'),status=document.getElementById('random-ai-status');

function pageRuntime(){
  'use strict';
  var KEY_SLOT='geminiApiKey',PAGE_SLOT='randomGeneratedHtml',MODEL='gemini-3.5-flash-lite';
  var form=document.getElementById('random-ai-bar'),input=document.getElementById('random-ai-input'),button=document.getElementById('random-ai-submit'),status=document.getElementById('random-ai-status');
  if(!form||!input||!button||!status)return;
  function show(message,error){status.textContent=message||'';status.classList.toggle('error',!!error);}
  function currentHtml(){
    var clone=document.documentElement.cloneNode(true);
    ['random-ai-bar','random-ai-status','random-ai-style','random-ai-runtime'].forEach(function(id){var el=clone.querySelector('#'+id);if(el)el.remove();});
    return '<!doctype html>\\n'+clone.outerHTML;
  }
  function installPage(html){
    var bar='<div id="random-ai-status" role="status" aria-live="polite"></div><form id="random-ai-bar"><input id="random-ai-input" autocomplete="off" placeholder="Describe anything you want to change…" aria-label="Describe a change"><button id="random-ai-submit" type="submit">Update</button></form>';
    var style='<style id="random-ai-style">#random-ai-bar{position:fixed!important;z-index:2147483647!important;left:50%!important;bottom:20px!important;transform:translateX(-50%)!important;width:min(760px,calc(100vw - 28px))!important;display:flex!important;gap:9px!important;align-items:center!important;padding:10px!important;border:1px solid rgba(180,200,255,.2)!important;border-radius:18px!important;background:rgba(10,16,32,.91)!important;box-shadow:0 12px 50px #0006!important;backdrop-filter:blur(22px)!important;color:#eef3ff!important;font:500 14px Inter,system-ui,sans-serif!important}#random-ai-bar input{flex:1!important;min-width:0!important;border:0!important;outline:0!important;background:transparent!important;color:inherit!important;font:inherit!important;padding:12px 10px!important}#random-ai-bar input::placeholder{color:#aab5ca!important}#random-ai-bar button{border:0!important;border-radius:12px!important;padding:11px 17px!important;background:#a8c7ff!important;color:#101a31!important;font:700 13px Inter,system-ui,sans-serif!important;cursor:pointer!important}#random-ai-bar button:disabled{opacity:.55!important;cursor:wait!important}#random-ai-status{position:fixed!important;z-index:2147483646!important;left:50%!important;bottom:89px!important;transform:translateX(-50%)!important;max-width:calc(100vw - 28px)!important;padding:8px 13px!important;border:1px solid #b4c8ff26!important;border-radius:10px!important;background:#0a1020e8!important;color:#d5e0f5!important;font:12px Inter,system-ui,sans-serif!important;text-align:center!important}#random-ai-status:empty{display:none!important}#random-ai-status.error{color:#ffaaaa!important}@media(max-width:520px){#random-ai-bar{bottom:12px!important;gap:5px!important}#random-ai-bar button{padding:11px 13px!important}}body{padding-bottom:90px!important}</style>';
    var output=html.trim();
    if(/<\\/body\\s*>/i.test(output))output=output.replace(/<\\/body\\s*>/i,bar+style+'</body>');
    else output+=bar+style;
    var runtimeTag='<script id="random-ai-runtime">('+pageRuntime.toString()+')();<'+'/script>';
    if(/<\\/html\\s*>/i.test(output))output=output.replace(/<\\/html\\s*>/i,runtimeTag+'</html>');
    else output+=runtimeTag;
    localStorage.setItem(PAGE_SLOT,html.trim());
    document.open();document.write(output);document.close();
  }
  async function ask(prompt,existing){
    var key=localStorage.getItem(KEY_SLOT);
    if(!key)throw new Error('No API key is saved. Reload and enter your Gemini API key.');
    var system=existing
      ?'You are editing an existing website. Apply the user request to the entire page. Preserve unrelated content, features, and working interactions. You may change any HTML, CSS, layout, text, or JavaScript needed. Return the complete updated HTML document only, without Markdown fences or explanation. Keep it self-contained.'
      :'You are a creative web developer. Build a complete, polished, responsive, interactive website from the user request. Return only the complete HTML document, without Markdown fences or explanation. Keep it self-contained.';
    var userText=existing?'USER CHANGE REQUEST:\\n'+prompt+'\\n\\nCURRENT COMPLETE HTML:\\n'+existing:(prompt||'Surprise me with a creative interactive web experience.');
    var response=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+MODEL+':generateContent?key='+encodeURIComponent(key),{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({system_instruction:{parts:[{text:system}]},contents:[{role:'user',parts:[{text:userText}]}],generationConfig:{temperature:0.8,maxOutputTokens:8192}})
    });
    var data=await response.json().catch(function(){return {};});
    if(!response.ok)throw new Error('Gemini API error (HTTP '+response.status+'): '+(data&&data.error&&data.error.message||'No details returned.'));
    var answer=data&&data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts?data.candidates[0].content.parts.map(function(p){return p.text||'';}).join('').trim():'';
    if(!answer)throw new Error('Gemini returned an empty response. It may have reached an output limit or safety filter.');
    return answer.replace(/^\`\`\`(?:html)?\\s*/i,'').replace(/\\s*\`\`\`$/,'').trim();
  }
  form.addEventListener('submit',async function(event){
    event.preventDefault();var prompt=input.value.trim();if(!prompt)return;
    button.disabled=true;button.textContent='Working…';show('Updating the entire page…');
    try{var result=await ask(prompt,currentHtml());installPage(result);}
    catch(error){show(error.message,true);button.disabled=false;button.textContent='Update';}
  });
}

function setStatus(message,error){status.textContent=message||'';status.classList.toggle('error',!!error);}
function cleanHtml(value){return value.replace(/^\`\`\`(?:html)?\\s*/i,'').replace(/\\s*\`\`\`$/,'').trim();}
function installPage(html){
  var bar='<div id="random-ai-status" role="status" aria-live="polite"></div><form id="random-ai-bar"><input id="random-ai-input" autocomplete="off" placeholder="Describe anything you want to change…" aria-label="Describe a change"><button id="random-ai-submit" type="submit">Update</button></form>';
  var style='<style id="random-ai-style">#random-ai-bar{position:fixed!important;z-index:2147483647!important;left:50%!important;bottom:20px!important;transform:translateX(-50%)!important;width:min(760px,calc(100vw - 28px))!important;display:flex!important;gap:9px!important;align-items:center!important;padding:10px!important;border:1px solid rgba(180,200,255,.2)!important;border-radius:18px!important;background:rgba(10,16,32,.91)!important;box-shadow:0 12px 50px #0006!important;backdrop-filter:blur(22px)!important;color:#eef3ff!important;font:500 14px Inter,system-ui,sans-serif!important}#random-ai-bar input{flex:1!important;min-width:0!important;border:0!important;outline:0!important;background:transparent!important;color:inherit!important;font:inherit!important;padding:12px 10px!important}#random-ai-bar input::placeholder{color:#aab5ca!important}#random-ai-bar button{border:0!important;border-radius:12px!important;padding:11px 17px!important;background:#a8c7ff!important;color:#101a31!important;font:700 13px Inter,system-ui,sans-serif!important;cursor:pointer!important}#random-ai-bar button:disabled{opacity:.55!important;cursor:wait!important}#random-ai-status{position:fixed!important;z-index:2147483646!important;left:50%!important;bottom:89px!important;transform:translateX(-50%)!important;max-width:calc(100vw - 28px)!important;padding:8px 13px!important;border:1px solid #b4c8ff26!important;border-radius:10px!important;background:#0a1020e8!important;color:#d5e0f5!important;font:12px Inter,system-ui,sans-serif!important;text-align:center!important}#random-ai-status:empty{display:none!important}#random-ai-status.error{color:#ffaaaa!important}@media(max-width:520px){#random-ai-bar{bottom:12px!important;gap:5px!important}#random-ai-bar button{padding:11px 13px!important}}body{padding-bottom:90px!important}</style>';
  var output=html.trim();
  if(/<\\/body\\s*>/i.test(output))output=output.replace(/<\\/body\\s*>/i,bar+style+'</body>');else output+=bar+style;
  var runtimeTag='<script id="random-ai-runtime">('+pageRuntime.toString()+')();<'+'/script>';
  if(/<\\/html\\s*>/i.test(output))output=output.replace(/<\\/html\\s*>/i,runtimeTag+'</html>');else output+=runtimeTag;
  localStorage.setItem(PAGE_SLOT,html.trim());
  document.open();document.write(output);document.close();
}
async function createPage(prompt){
  var key=localStorage.getItem(KEY_SLOT),system='You are a creative web developer. Build a complete, polished, responsive, interactive website from the user request. Return only the complete HTML document, without Markdown fences or explanation. Keep it self-contained.';
  var response=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+MODEL+':generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system_instruction:{parts:[{text:system}]},contents:[{role:'user',parts:[{text:prompt||'Surprise me with a creative interactive web experience.'}]}],generationConfig:{temperature:0.8,maxOutputTokens:8192}})});
  var data=await response.json().catch(function(){return {};});
  if(!response.ok)throw new Error('Gemini API error (HTTP '+response.status+'): '+(data&&data.error&&data.error.message||'No details returned.'));
  var answer=data&&data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts?data.candidates[0]..content.parts.map(function(p){return p.text||'';}).join('').trim():'';
  if(!answer)throw new Error('Gemini returned an empty response.');
  return cleanHtml(answer);
}
form.addEventListener('submit',async function(event){
  event.preventDefault();var value=input.value;if(!value)return;
  if(!localStorage.getItem(KEY_SLOT)){
    localStorage.setItem(KEY_SLOT,value);input.value='';input.placeholder='Describe the page you want to create…';button.textContent='Generate';setStatus('API key saved locally. Now describe what you want to build.');return;
  }
  button.disabled=true;button.textContent='Working…';setStatus('Creating your page…');
  try{var html=await createPage(value);installPage(html);}
  catch(error){setStatus(error.message,true);button.disabled=false;button.textContent='Generate';}
});
var saved=localStorage.getItem(PAGE_SLOT),key=localStorage.getItem(KEY_SLOT);
if(saved){installPage(saved);}
else if(!key){input.placeholder='Paste your Gemini API key to start…';button.textContent='Save key';setStatus('Paste your Gemini API key into this bar. It will be saved in this browser only.');}
else{input.placeholder='Describe the page you want to create…';button.textContent='Generate';setStatus('Your key is saved. Describe a page to create.');}
})();
</script></body></html>
